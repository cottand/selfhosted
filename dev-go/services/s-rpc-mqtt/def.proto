syntax = "proto3";
package s_rpc_mqtt;

option go_package = "github.com/Cottand/selfosted/dev-go/lib/proto/s-rpc-mqtt";

import "google/protobuf/empty.proto";

service Mqtt {
  rpc Dummy(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc SetAquariumSchedule(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc SetLight(SetLightRequest) returns (LightStatus) {}
  rpc GetLight(GetLightRequest) returns (LightStatus) {}
}

message SetLightRequest {
  // e.g. plug103
  string id = 1;
  bool on = 2;
}

message GetLightRequest {
  // e.g. plug103
  string id = 1;
}

message LightStatus {
  string id = 1;
  bool on = 2;
}
