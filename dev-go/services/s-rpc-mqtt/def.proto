syntax = "proto3";
package s_rpc_mqtt;

option go_package = "github.com/Cottand/selfosted/dev-go/lib/proto/s-rpc-mqtt";

import "google/protobuf/empty.proto";

service Mqtt {
  rpc Dummy(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc SetAquariumSchedule(google.protobuf.Empty) returns (google.protobuf.Empty) {}
}